name: Build EMP Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build update zip
        run: |
          mkdir -p dist/EMP
          rsync -a --exclude .git --exclude dist ./ dist/EMP/
          cd dist && zip -qr Evils_Media_Encoding_Platform_Update.zip EMP
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Evils_Media_Encoding_Platform_Update.zip
