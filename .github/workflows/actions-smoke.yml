name: EMP shell recovery verifier

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Recover and verify EMP source without external Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch emp-5-recovery-baseline --single-branch https://github.com/EvildeadNZ/EMO.git emp-recovery
          cd emp-recovery
          cat recovery/source_chunks/part*.b64 > /tmp/emp-source.gz.b64
          base64 --decode --ignore-garbage /tmp/emp-source.gz.b64 > /tmp/emp-source.gz
          echo "7ed4622204042e93a74eed97b798a40db60caee8004098036bea2b230b9184c0  /tmp/emp-source.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/emp-source.gz > emo/main_window.py
          python recovery/finalize_recovery.py
          git config user.name "EMP Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add emo/main_window.py emo/version.py update-package.json
          if git diff --cached --quiet; then
            echo "Recovery baseline already matches."
            exit 0
          fi
          git commit -m "recovery: restore hash-verified EMP working baseline"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/EvildeadNZ/EMO.git"
          git push origin HEAD:emp-5-recovery-baseline
