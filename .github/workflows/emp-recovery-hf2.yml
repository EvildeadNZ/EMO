name: EMP recovery HF2 patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/emp-recovery-hf2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply hash-gated HF2 patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch emp-5-recovery-pr --single-branch https://github.com/EvildeadNZ/EMO.git emp-hf2
          cd emp-hf2
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import py_compile

          source = Path('emo/main_window.py')
          before = hashlib.sha256(source.read_bytes()).hexdigest()
          expected_before = '47648049aa9775b8b5b860c12ad38b3858174e5b8d09bc092771cc47222d1c83'
          if before != expected_before:
              raise SystemExit(f'Refusing patch: unexpected HF1 source SHA-256 {before}')

          text = source.read_text(encoding='utf-8')

          old_formula = 'total_kbps = (target_bytes * 8 * 0.96) / (duration / 1000)'
          new_formula = 'total_kbps = (target_bytes * 8 * 0.96) / duration / 1000'
          if text.count(old_formula) != 1:
              raise SystemExit('Expected exactly one broken bitrate formula')
          text = text.replace(old_formula, new_formula, 1)

          old_loop = '''        assert process.stdout is not None
        for raw in process.stdout:
            line = raw.rstrip()
            log(line)
            if "Encoding:" in line:
'''
          new_loop = '''        assert process.stdout is not None
        recent_lines = deque(maxlen=20)
        for raw in process.stdout:
            line = raw.rstrip()
            log(line)
            if line:
                recent_lines.append(line)
            if "Encoding:" in line:
'''
          if text.count(old_loop) != 1:
              raise SystemExit('Expected exactly one HandBrake output loop')
          text = text.replace(old_loop, new_loop, 1)

          old_error = '''        code = process.wait()
        if code != 0:
            raise RuntimeError(f"HandBrake failed with exit code {code}.")
'''
          new_error = '''        code = process.wait()
        if code != 0:
            details = "\\n".join(recent_lines)
            if details:
                raise RuntimeError(
                    f"HandBrake failed with exit code {code}.\\n\\n"
                    f"Last HandBrake output:\\n{details}"
                )
            raise RuntimeError(f"HandBrake failed with exit code {code}.")
'''
          if text.count(old_error) != 1:
              raise SystemExit('Expected exactly one HandBrake error block')
          text = text.replace(old_error, new_error, 1)

          source.write_text(text, encoding='utf-8', newline='\n')
          py_compile.compile(str(source), doraise=True)
          after = hashlib.sha256(source.read_bytes()).hexdigest()
          expected_after = 'bdc8076eca20f0877c1cd803c9d1b696b95a0fef9519e9a47b3f4a9b1aee713e'
          if after != expected_after:
              raise SystemExit(f'Patched source hash mismatch: {after}')

          version = '5.0.0-m2.8-recovery1-hf2'
          Path('emo/version.py').write_text(f'APP_VERSION = "{version}"\n', encoding='utf-8')

          manifest_path = Path('update-package.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = version
          notes = [
              'Hotfix 2: corrected target bitrate calculation that could request an impossibly high NVENC bitrate and cause HandBrake exit code 3.',
              'HandBrake failures now include the last 20 output lines so future encoder errors show their actual cause.',
              'Hotfix 1: corrected subprocess.list2cmd1 to subprocess.list2cmdline so HandBrake can launch during encoding.'
          ]
          existing = [n for n in manifest.get('notes', []) if not str(n).startswith('Hotfix')]
          manifest['notes'] = notes + existing
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          release = Path('docs/releases/5.0.0-m2.8-recovery1-hf2.md')
          release.write_text('''# EMP 5.0.0-m2.8-recovery1-hf2 — HandBrake Bitrate Calculation Hotfix

## Release details

- **Tag:** `v5.0.0-m2.8-recovery1-hf2`
- **Release title:** **EMP 5.0.0-m2.8-recovery1-hf2 — HandBrake Bitrate Calculation Hotfix**
- **Status:** Recovery test candidate; do not publish until Windows queue testing passes.

## What changed

- Corrects the target bitrate formula used for size-targeted encoding.
- The old formula divided movie duration by 1000 before dividing target bits, inflating the requested bitrate by about 1,000,000×.
- The corrected formula converts the final bits-per-second result to kbps instead.
- HandBrake non-zero exits now include the last 20 non-empty HandBrake output lines in the EMP error message.
- Keeps the HF1 `subprocess.list2cmdline` correction.

## Safety

No NAS replacement/deletion logic is changed. The original movie remains protected until a completed output has copied back and passed verification.
''', encoding='utf-8')

          print('HF2 source SHA-256:', after)
          print('HF2 version:', version)
          PY

          git config user.name "EMP Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add emo/main_window.py emo/version.py update-package.json docs/releases/5.0.0-m2.8-recovery1-hf2.md
          git commit -m "fix: correct HandBrake target bitrate calculation"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/EvildeadNZ/EMO.git"
          git push origin HEAD:emp-5-recovery-pr
