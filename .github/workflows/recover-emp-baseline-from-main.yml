name: Recover EMP baseline from main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover-emp-baseline-from-main.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: emp-5-recovery-baseline
          fetch-depth: 0

      - name: Reconstruct and verify recovered EMP source
        shell: bash
        run: |
          set -euo pipefail
          for part in 01 02 03 04 05; do
            test -f "recovery/source_chunks/part${part}.b64"
          done
          cat recovery/source_chunks/part*.b64 > /tmp/emp-source.gz.b64
          base64 --decode /tmp/emp-source.gz.b64 > /tmp/emp-source.gz
          echo "7ed4622204042e93a74eed97b798a40db60caee8004098036bea2b230b9184c0  /tmp/emp-source.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/emp-source.gz > emo/main_window.py
          echo "4b766157a58b6be7fbebd1a2a8e70c15802bbd5373d302bcbc3771631e744798  emo/main_window.py" | sha256sum --check -
          python -m py_compile emo/main_window.py

      - name: Set recovery version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          version = "5.0.0-m2.8-recovery1"
          Path("emo/version.py").write_text(f'APP_VERSION = "{version}"\n', encoding="utf-8")

          manifest_path = Path("update-package.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["name"] = "Evil's Media Encoding Platform"
          manifest["version"] = version
          manifest["notes"] = [
              "Recovered and hash-verified EMP 5 working baseline from the August 16 development source.",
              "Restores the multi-file queue lifetime/snapshot fix so processing continues beyond the first item.",
              "Restores process-safe close and system-tray behavior from the m2.7-hf4 lineage.",
              "Restores Platform Builder, guided Jellyfin setup, UI text scaling, themes, update checks and later working-source fixes.",
              "Restores the missing service-status traffic-light indicator and repairs the corrupted encoding calculation block.",
              "This recovery release reconciles GitHub source with the later working EMP code before bootstrap-installer work begins."
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          python -m py_compile emo/main_window.py emo/version.py

      - name: Commit verified recovery baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EMP Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add emo/main_window.py emo/version.py update-package.json
          if git diff --cached --quiet; then
            echo "Recovery baseline already matches."
            exit 0
          fi
          git commit -m "recovery: restore hash-verified EMP working baseline"
          git push origin HEAD:emp-5-recovery-baseline
